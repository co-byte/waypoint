name: CD
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      etl: ${{ steps.filter.outputs.etl }}
      monitoring: ${{ steps.filter.outputs.monitoring }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            etl:
              - apps/etl/**
              - .github/workflows/cd.yaml
            monitoring:
              - apps/monitoring/**
              - .github/workflows/cd.yaml
            site:
              - apps/site/**
              - .github/workflows/cd.yaml
  deploy-etl:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.etl == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m # OAuth seems to be the only type supported in free edition
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_admin_user: ${{ secrets.DATABRICKS_ADMIN_USER }}
    defaults:
      run:
        working-directory: apps/etl
    steps:
      - uses: actions/checkout@v6
      - uses: databricks/setup-cli@main
      - name: Validate bundle
        run: databricks bundle validate --strict
      - name: Deploy bundle
        run: databricks bundle deploy
  deploy-monitoring:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.monitoring == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m # OAuth seems to be the only type supported in free edition
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    defaults:
      run:
        working-directory: apps/monitoring
    steps:
      - uses: actions/checkout@v6
      - uses: databricks/setup-cli@main
      - name: Validate bundle
        run: databricks bundle validate --strict
      - name: Deploy bundle
        run: databricks bundle deploy
  deploy-site:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Build & Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: apps/site
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
