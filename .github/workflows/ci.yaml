name: CI
permissions:
  contents: read
on:
  pull_request:
env:
  DATABRICKS_AUTH_TYPE: oauth-m2m # OAuth seems to be the only type supported in free edition
  DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      etl: ${{ steps.filter.outputs.etl }}
      monitoring: ${{ steps.filter.outputs.monitoring }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            etl:
              - apps/etl/**
              - .github/workflows/ci.yaml
            monitoring:
              - apps/monitoring/**
              - .github/workflows/ci.yaml
            site:
              - apps/site/**
              - .github/workflows/ci.yaml
  validate-etl:
    needs: detect-changes
    if: needs.detect-changes.outputs.etl == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUNDLE_VAR_admin_user: ${{ secrets.DATABRICKS_ADMIN_USER }}
    defaults:
      run:
        working-directory: apps/etl
    steps:
      - uses: actions/checkout@v7
      - uses: databricks/setup-cli@v1.18.0
      - name: Validate bundle
        run: databricks bundle validate --strict
  validate-monitoring:
    needs: detect-changes
    if: needs.detect-changes.outputs.monitoring == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/monitoring
    steps:
      - uses: actions/checkout@v7
      - uses: databricks/setup-cli@v1.18.0
      - name: Validate bundle
        run: databricks bundle validate --strict
  preview-site:
    needs: detect-changes
    # Fork and Dependabot PRs get no secrets
    if: needs.detect-changes.outputs.site == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Upload preview version
        id: upload
        uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: apps/site
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }} --message "PR ${{ github.event.pull_request.number }}"
      - name: Comment preview url
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND_OUTPUT: ${{ steps.upload.outputs.command-output }}
        run: |
          url=$(grep -oP 'Version Preview Alias URL: \K\S+' <<< "$COMMAND_OUTPUT")
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --edit-last --create-if-none --body "Site preview: $url"
  ci-passed:
    needs: [detect-changes, validate-etl, validate-monitoring, preview-site]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
