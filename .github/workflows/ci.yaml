name: CI
permissions:
  contents: read
on:
  pull_request:
env:
  DATABRICKS_AUTH_TYPE: oauth-m2m # OAuth seems to be the only type supported in free edition
  DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      etl: ${{ steps.filter.outputs.etl }}
      monitoring: ${{ steps.filter.outputs.monitoring }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            etl:
              - apps/etl/**
              - .github/workflows/ci.yaml
            monitoring:
              - apps/monitoring/**
              - .github/workflows/ci.yaml
  validate-etl:
    needs: changes
    if: needs.changes.outputs.etl == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_VAR_admin_user: ${{ secrets.DATABRICKS_ADMIN_USER }}
    defaults:
      run:
        working-directory: apps/etl
    steps:
      - uses: actions/checkout@v6
      - uses: databricks/setup-cli@v1.18.0
      - name: Validate bundle
        run: databricks bundle validate --strict
  validate-monitoring:
    needs: changes
    if: needs.changes.outputs.monitoring == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/monitoring
    steps:
      - uses: actions/checkout@v6
      - uses: databricks/setup-cli@v1.18.0
      - name: Validate bundle
        run: databricks bundle validate --strict
  validate:
    needs: [changes, validate-etl, validate-monitoring]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
