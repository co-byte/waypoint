repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: wrangler-types
        name: wrangler types are up to date
        entry: bash -c 'cd apps/site && npx --no-install wrangler types --check'
        language: system
        files: ^apps/site/(wrangler\.jsonc|worker-configuration\.d\.ts)$
        pass_filenames: false
      - id: databricks-bundle-validate
        name: databricks bundle is valid
        entry: bash -c 'cd apps/etl && databricks bundle validate --strict --var admin_user="${BUNDLE_VAR_admin_user:-placeholder}"'
        language: system
        files: ^apps/etl/(databricks\.yml|catalog/.*\.yaml|ingestion/.*\.yaml|transform/.*\.yaml)$
        pass_filenames: false
      - id: databricks-monitoring-bundle-validate
        name: databricks monitoring bundle is valid
        entry: bash -c 'cd apps/monitoring && databricks bundle validate --strict'
        language: system
        files: ^apps/monitoring/(databricks\.yml|dashboards/.*)$
        pass_filenames: false
