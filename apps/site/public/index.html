<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Waypoint - Live Flight Tracker</title>
		<meta name="description" content="Live aircraft positions on a 3D globe. Select an aircraft to see its altitude, speed and heading." />
		<meta name="theme-color" content="#181818" />
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="preconnect" href="https://tiles.openfreemap.org" />
		<link rel="preconnect" href="https://s3.amazonaws.com" />
		<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.10.0/dist/maplibre-gl.mjs" />
		<!-- Only styles what Cesium creates, and Cesium loads later, so the first paint does not wait for it -->
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Widgets/widgets.css"
			media="print"
			onload="this.media = 'all'"
		/>
		<link rel="stylesheet" href="/styles.css" />
		<link rel="preload" href="/api/latest-flight-state" as="fetch" crossorigin />
		<link rel="preload" href="https://tiles.openfreemap.org/styles/dark" as="fetch" crossorigin />
		<link rel="modulepreload" href="/viewer.js" />
		<link rel="modulepreload" href="/basemap.js" />
		<link rel="modulepreload" href="/common.js" />
		<link rel="modulepreload" href="/flight.js" />
		<link rel="modulepreload" href="/selection.js" />
		<link rel="modulepreload" href="/details.js" />
		<link rel="modulepreload" href="/display.js" />
		<link rel="modulepreload" href="/controls.js" />
		<link rel="modulepreload" href="/aircraft.js" />
		<link rel="modulepreload" href="/search.js" />
	</head>

	<body>
		<header id="header">
			<svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
				<path d="M32 6L58 32L32 58L6 32Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round" />
				<path d="M8 47Q32 14 56 47" stroke-width="3" stroke-linecap="round" stroke-dasharray="1.5 7" stroke="#c97c3d" />
				<circle cx="32" cy="32" r="6" fill="#c97c3d" />
			</svg>
			<h1>Waypoint</h1>
			<div id="loading" role="status" aria-label="Loading aircraft"></div>
			<p id="feed-error" role="alert" hidden>Aircraft data unavailable</p>
			<form id="search-form" role="search">
				<span id="search-count" aria-live="polite"></span>
				<input
					id="search"
					type="search"
					placeholder="Callsign or ICAO"
					aria-label="Search aircraft by callsign or ICAO address"
					autocomplete="off"
					spellcheck="false"
					disabled
				/>
			</form>
		</header>
		<main id="viewer"></main>
		<div id="controls">
			<button id="compass" aria-label="Reset north">
				<svg viewBox="0 0 30 30">
					<path d="M15 5l4 10h-8z" fill="#c97c3d" />
					<path d="M15 25l-4-10h8z" fill="#ededed" fill-opacity="0.4" />
				</svg>
			</button>
		</div>
		<div id="selection-box" hidden></div>
		<aside id="details" hidden>
			<div id="groups"></div>
			<div id="summary" hidden></div>
		</aside>

		<script src="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Cesium.js" defer></script>
		<script type="module" src="/app.js"></script>
	</body>
</html>
