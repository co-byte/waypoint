resources:
  pipelines:
    flight_tracking_pipeline:
      name: flight_tracking_pipeline
      catalog: ${var.catalog}
      schema: ${var.silver_schema}
      serverless: true
      configuration:
        opensky_token_url: ${var.opensky_token_url}
        bronze_schema: ${var.bronze_schema}
        silver_schema: ${var.silver_schema}
        gold_schema: ${var.gold_schema}
        reference_schema: ${var.reference_schema}
        opensky_cleaned_table: ${var.opensky_cleaned_table}
        opensky_enriched_table: ${var.opensky_enriched_table}
        opensky_aircraft_category_table: ${var.opensky_aircraft_category_table}
        opensky_position_source_table: ${var.opensky_position_source_table}
        flight_state_changes_view: ${var.flight_state_changes_view}
        aircraft_table: ${var.aircraft_table}
        aircraft_changes_view: ${var.aircraft_changes_view}
        flight_state_table: ${var.flight_state_table}
        last_known_flight_state_table: ${var.last_known_flight_state_table}
        recent_flight_state_view: ${var.recent_flight_state_view}
        recent_positions_kept: ${var.recent_positions_kept}
        opensky_state_vectors_table: ${var.opensky_state_vectors_table}
        flight_cache_kv_namespace_id: ${var.flight_cache_kv_namespace_id}
        flight_cache_kv_key: ${var.flight_cache_kv_key}
        flight_cache_kv_ttl_seconds: ${var.flight_cache_kv_ttl_seconds}
      root_path: .
      libraries:
        - glob:
            include: ../../ingestion/opensky/ingest.py
        - glob:
            include: silver/transformations/**
        - glob:
            include: gold/transformations/**
        - glob:
            include: ../../serving/cloudflare/push_flight_state.py
