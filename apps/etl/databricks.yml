bundle:
  name: waypoint-etl

include:
  - catalog/*.yaml
  - ingestion/*/*.yaml
  - transform/*/*.yaml

variables:
  catalog:
    description: Unity Catalog that holds all tables
    default: waypoint_catalog
  bronze_schema:
    default: bronze
  opensky_state_vectors_table:
    default: opensky_state_vectors
  silver_schema:
    default: silver
  opensky_cleaned_table:
    default: opensky_cleaned
  opensky_enriched_table:
    default: opensky_enriched
  opensky_aircraft_category_table:
    default: opensky_aircraft_category
  opensky_position_source_table:
    default: opensky_position_source
  flight_state_changes_view:
    default: flight_state_changes
  aircraft_table:
    default: aircraft
  aircraft_changes_view:
    default: aircraft_changes
  flight_state_table:
    default: flight_state
  gold_schema:
    default: gold
  last_known_flight_state_table:
    default: last_known_flight_state
  recent_flight_state_view:
    default: recent_flight_state
  recent_positions_kept:
    description: Number of positions per aircraft stored in the recent_flight_state (newest first)
    default: 2
  reference_schema:
    default: reference
  flight_cache_kv_namespace_id:
    description: Cloudflare KV namespace the site's Worker reads the latest flight state from
    default: 1e82c18c98e4455392a6deb44f400014
  flight_cache_kv_key:
    description: Key the site's Worker reads the latest flight state from
    default: latest-flight-state
  flight_cache_kv_ttl_seconds:
    description: Keeps the site showing the last known aircraft for the rest of the day when the pipeline is down or out of compute quota
    default: 86400
  opensky_token_url:
    default: https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token
  website_principal:
    description: Application ID of the website's Cloudflare Worker - has read access to `silver` and `gold`
    lookup:
      # Created manually via the UI; matched by display name
      service_principal: Cloudflare Worker
  admin_user:
    description: User name of the workspace admin - has full access to the catalog; set via `BUNDLE_VAR_admin_user`
  workspace_root_path:
    description: Workspace path bundle resources are deployed under
    default: /Workspace/Shared/waypoint/.bundle/${bundle.name}/${bundle.target}
  github_actions_principal:
    description: Application ID of the GitHub Actions deploy service principal
    lookup:
      # Created manually via the UI; matched by display name
      service_principal: Waypoint - GitHub Workflow

targets:
  prod:
    default: true
    mode: production
    workspace:
      root_path: ${var.workspace_root_path}
    run_as:
      service_principal_name: ${var.github_actions_principal}
    permissions:
      - level: CAN_MANAGE
        group_name: users
